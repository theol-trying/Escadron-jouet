<!doctype html>
<!--
  Carte d'aperçu des liens (Discord, WhatsApp, Messenger…) : public/og-image.png, 1200 × 630.
  Pour la régénérer après une modification (Chrome ou Edge installé) :
    chrome --headless=new --hide-scrollbars --force-device-scale-factor=1 --window-size=1200,630 ^
      --user-data-dir=%TEMP%\og-chrome --screenshot=public\og-image.png scripts\og-image.html
-->
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Escadrille Jouet — aperçu</title>
    <style>
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }
      body {
        position: relative;
        font-family: 'Segoe UI', 'Trebuchet MS', system-ui, sans-serif;
        /* Wallpaper of the room: soft sky blue with toy-box stripes */
        background:
          repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.28) 0 34px, rgba(255, 255, 255, 0) 34px 68px),
          linear-gradient(180deg, #9fd8ff 0%, #cdeeff 62%, #e8f7ff 100%);
      }
      .desk {
        position: absolute;
        left: -40px;
        right: -40px;
        bottom: -10px;
        height: 205px;
        background:
          repeating-linear-gradient(176deg, rgba(120, 66, 24, 0.16) 0 3px, rgba(0, 0, 0, 0) 3px 23px),
          linear-gradient(180deg, #d9a066 0%, #c4864a 55%, #a96c35 100%);
        border-top: 10px solid #8a5426;
        transform: perspective(900px) rotateX(18deg);
        transform-origin: bottom;
      }
      svg.scene {
        position: absolute;
        inset: 0;
      }
      .tagline {
        position: absolute;
        left: 50%;
        top: 300px;
        transform: translateX(-50%);
        white-space: nowrap;
        padding: 14px 34px;
        border: 5px solid #18181b;
        border-radius: 999px;
        background: #ffffff;
        color: #18181b;
        font-size: 34px;
        font-weight: 800;
        box-shadow: 0 7px 0 #18181b;
      }
      .chips {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 34px;
        display: flex;
        justify-content: center;
        gap: 22px;
      }
      .chip {
        padding: 10px 24px;
        border: 4px solid #18181b;
        border-radius: 16px;
        background: #facc15;
        color: #18181b;
        font-size: 27px;
        font-weight: 800;
        box-shadow: 0 5px 0 #18181b;
      }
      .chip.blue {
        background: #38bdf8;
      }
      .chip.red {
        background: #f87171;
      }
    </style>
  </head>
  <body>
    <div class="desk"></div>
    <svg class="scene" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
      <!-- Lego brick on the desk (left) -->
      <g transform="translate(24 446) scale(0.9)">
        <rect x="0" y="26" width="150" height="74" rx="8" fill="#ef4444" stroke="#18181b" stroke-width="5" />
        <rect x="12" y="8" width="34" height="22" rx="5" fill="#f87171" stroke="#18181b" stroke-width="5" />
        <rect x="58" y="8" width="34" height="22" rx="5" fill="#f87171" stroke="#18181b" stroke-width="5" />
        <rect x="104" y="8" width="34" height="22" rx="5" fill="#f87171" stroke="#18181b" stroke-width="5" />
      </g>
      <!-- Pencil on the desk (right) -->
      <g transform="translate(1030 488) rotate(-10) scale(0.62)">
        <rect x="0" y="0" width="210" height="30" rx="4" fill="#facc15" stroke="#18181b" stroke-width="5" />
        <rect x="0" y="0" width="34" height="30" rx="4" fill="#f9a8d4" stroke="#18181b" stroke-width="5" />
        <polygon points="210,0 250,15 210,30" fill="#fde68a" stroke="#18181b" stroke-width="5" stroke-linejoin="round" />
        <polygon points="236,10 250,15 236,20" fill="#18181b" />
      </g>

      <!-- Title lockup (same drawing as the title screen) -->
      <g transform="translate(222 18) scale(1.8)">
        <path d="M24 38 L88 26 L76 44 L110 42 L74 56 L30 52 Z" fill="#FACC15" stroke="#18181B" stroke-width="4" stroke-linejoin="round" />
        <path d="M396 38 L332 26 L344 44 L310 42 L346 56 L390 52 Z" fill="#FACC15" stroke="#18181B" stroke-width="4" stroke-linejoin="round" />
        <circle cx="210" cy="24" r="14" fill="#EF4444" stroke="#18181B" stroke-width="4" />
        <polygon points="210,14 213,21 220,21 214,26 216,33 210,29 204,33 206,26 200,21 207,21" fill="#FEF08A" />
        <text x="210" y="76" text-anchor="middle" font-family="Segoe UI Black, Arial Black, sans-serif" font-weight="900"
          font-size="46" fill="#FFFFFF" stroke="#18181B" stroke-width="8" paint-order="stroke fill" letter-spacing="0.5">ESCADRILLE</text>
        <text x="210" y="112" text-anchor="middle" font-family="Segoe UI Black, Arial Black, sans-serif" font-weight="900"
          font-size="33" fill="#38BDF8" stroke="#18181B" stroke-width="7" paint-order="stroke fill" letter-spacing="4">JOUET</text>
      </g>

      <!-- Blue plane chasing (left), tracer dashes toward the red one -->
      <g stroke="#facc15" stroke-width="6" stroke-linecap="round">
        <line x1="214" y1="196" x2="244" y2="186" />
        <line x1="266" y1="179" x2="296" y2="169" />
      </g>
      <g transform="translate(118 226) rotate(-17) scale(0.82)">
        <path d="M-120 0 C -90 -6, -60 -6, -40 -2" stroke="#ffffff" stroke-width="7" fill="none" stroke-linecap="round" opacity="0.85" />
        <rect x="-44" y="-14" width="104" height="28" rx="14" fill="#38bdf8" stroke="#18181b" stroke-width="5" />
        <path d="M-4 -12 L 18 -62 L 34 -62 L 30 -12 Z" fill="#facc15" stroke="#18181b" stroke-width="5" stroke-linejoin="round" />
        <path d="M-4 12 L 14 48 L 30 48 L 30 12 Z" fill="#eab308" stroke="#18181b" stroke-width="5" stroke-linejoin="round" />
        <path d="M-44 -6 L -58 -30 L -46 -30 L -30 -10 Z" fill="#facc15" stroke="#18181b" stroke-width="5" stroke-linejoin="round" />
        <circle cx="38" cy="-3" r="7" fill="#e0f2fe" stroke="#18181b" stroke-width="4" />
        <circle cx="64" cy="0" r="5" fill="#18181b" />
        <ellipse cx="66" cy="0" rx="5" ry="22" fill="#94a3b8" stroke="#18181b" stroke-width="3" opacity="0.8" />
      </g>

      <!-- Red plane escaping (right), with wing trails -->
      <g transform="translate(1062 178) rotate(-22) scale(1.02)">
        <path d="M-110 -4 C -90 -8, -70 -7, -48 -4" stroke="#ffffff" stroke-width="7" fill="none" stroke-linecap="round" opacity="0.85" />
        <path d="M-96 22 C -80 19, -60 17, -40 14" stroke="#ffffff" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.6" />
        <rect x="-50" y="-15" width="118" height="30" rx="15" fill="#ef4444" stroke="#18181b" stroke-width="5" />
        <path d="M-6 -13 L 18 -70 L 36 -70 L 32 -13 Z" fill="#facc15" stroke="#18181b" stroke-width="5" stroke-linejoin="round" />
        <path d="M-6 13 L 14 52 L 32 52 L 32 13 Z" fill="#eab308" stroke="#18181b" stroke-width="5" stroke-linejoin="round" />
        <path d="M-50 -6 L -66 -34 L -52 -34 L -34 -10 Z" fill="#facc15" stroke="#18181b" stroke-width="5" stroke-linejoin="round" />
        <circle cx="42" cy="-3" r="8" fill="#bae6fd" stroke="#18181b" stroke-width="4" />
        <polygon points="14,-2 17,5 24,5 18,9 21,16 14,12 7,16 10,9 4,5 11,5" fill="#fef08a" stroke="#18181b" stroke-width="2" />
        <circle cx="72" cy="0" r="5" fill="#18181b" />
        <ellipse cx="74" cy="0" rx="5" ry="24" fill="#94a3b8" stroke="#18181b" stroke-width="3" opacity="0.8" />
      </g>
    </svg>

    <div class="tagline">Combat aérien d’avions jouets en 3D · multijoueur</div>
    <div class="chips">
      <div class="chip">4 pièces géantes</div>
      <div class="chip blue">4 modes de jeu</div>
      <div class="chip red">Invite tes amis !</div>
    </div>
  </body>
</html>
